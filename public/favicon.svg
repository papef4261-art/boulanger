<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich emerald gradient for professional financial identity -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B382B" />
      <stop offset="100%" stop-color="#2D5A43" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D776" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E7EFEA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0B1A13" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background: Smooth Rounded Rectangle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3E7559" stroke-width="1.5" />

  <!-- Inner subtle glow frame -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <!-- Cash Register & Financial Ledger Graphic -->
  <g filter="url(#shadow)">
    <!-- Cash Register Screen / Header -->
    <rect x="16" y="14" width="32" height="10" rx="3" fill="#0E2319" stroke="#3E7559" stroke-width="1" />
    <circle cx="21" cy="19" r="1.8" fill="url(#goldGrad)" />
    <!-- Display digits line -->
    <line x1="27" y1="19" x2="43" y2="19" stroke="#75B896" stroke-width="2.2" stroke-linecap="round" />

    <!-- Ledger & Growth Bar Chart (Ascending Gains Bars) -->
    <!-- Bar 1 (Left) -->
    <rect x="18" y="32" width="6.5" height="12" rx="1.8" fill="url(#barGrad)" />
    <!-- Bar 2 (Middle) -->
    <rect x="28.5" y="27" width="6.5" height="17" rx="1.8" fill="url(#barGrad)" />
    <!-- Bar 3 (Right - Highest Gain) -->
    <rect x="39" y="22" width="6.5" height="22" rx="1.8" fill="url(#goldGrad)" />

    <!-- Upward Trend Arrow -->
    <path d="M21 28 L30 22 L42 16" fill="none" stroke="#F9D776" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="41,13 47,15 44,20" fill="#F9D776" />

    <!-- Cash Drawer Base -->
    <path d="M14 47 C14 45.5 15.5 45 17 45 L47 45 C48.5 45 50 45.5 50 47 L48 50 C48 51 47 51.5 45.5 51.5 L18.5 51.5 C17 51.5 16 51 16 50 Z" fill="#0E2319" stroke="#3E7559" stroke-width="1" />
    <!-- Cash drawer keyhole / button -->
    <circle cx="32" cy="48" r="1.3" fill="url(#goldGrad)" />
  </g>
</svg>
